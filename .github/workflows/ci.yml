name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      # Build-only placeholders — real secrets belong in your deployment target.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      UPSTASH_REDIS_REST_AUTH_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_AUTH_TOKEN: placeholder
      IMAGE_KIT_PUBLIC_KEY: placeholder
      IMAGE_KIT_PRIVATE_KIT: placeholder
      IMAGE_KIT_ENDPOINT: https://example.com
      GOOGLE_OAUTH_CLIENT_ID: placeholder
      GOOGLE_OAUTH_CLIENT_SECRET: placeholder
      OAUTH_REDIRECT_URI: http://localhost:3000
      EMAIL_INDEX_HMAC_KEY: placeholder
      EMAIL_ENCRYPTION_KEY1: placeholder
      EMAIL_ENCRYPTION_KEY2: placeholder
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Hook your platform here, e.g. Vercel:
      # - name: Deploy to Vercel
      #   run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy placeholder
        run: echo "Configure your deployment target (Vercel/self-hosted) in this step."
